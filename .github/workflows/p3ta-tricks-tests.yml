name: p3ta-tricks integration

on:
  push:
    branches:
      - feature/p3ta-tricks-offline-integration

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p3ta-tricks-offline-integration
      - name: Patch nested wheelhouse discovery
        env:
          OLD_BLOCK: 
          NEW_BLOCK: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('lib/install_p3ta_tricks.sh')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_BLOCK']).decode()
          new = base64.b64decode(os.environ['NEW_BLOCK']).decode()
          if text.count(old) != 1:
              raise SystemExit('expected dependency block exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n lib/install_p3ta_tricks.sh
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/install_p3ta_tricks.sh
          git commit -m 'fix(p3ta-tricks): discover nested wheelhouse artifacts'
          git push origin HEAD:feature/p3ta-tricks-offline-integration
