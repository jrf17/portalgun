name: p3ta-tricks integration

on:
  push:
    branches:
      - feature/p3ta-tricks-offline-integration
  pull_request:
    paths:
      - '.github/workflows/p3ta-tricks-tests.yml'
      - 'bin/portalgun'
      - 'completion/_portalgun'
      - 'installers/portalgun_install.sh'
      - 'lib/doctor.sh'
      - 'lib/install_p3ta_tricks.sh'
      - 'lib/sync_web.sh'
      - 'tests/test_p3ta_tricks_*.sh'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq zsh
      - name: Run policy tests
        run: bash tests/test_p3ta_tricks_policy.sh
      - name: Run transactional tests
        run: bash tests/test_p3ta_tricks_transaction.sh
      - name: Run integration contract tests
        run: bash tests/test_p3ta_tricks_integration.sh
      - name: Capture dependency diagnostics
        if: always()
        run: |
          set -e
          rm -rf /tmp/p3ta-upstream
          git clone --depth 1 https://github.com/p3ta00/p3ta-tricks-offline.git /tmp/p3ta-upstream
          {
            printf '%s\n' '===== PYTHON ====='
            python3 --version
            python3 -m pip --version
            printf '%s\n' '===== REQUIREMENTS ====='
            cat /tmp/p3ta-upstream/requirements.txt
            printf '%s\n' '===== VENDOR CONTENTS ====='
            find /tmp/p3ta-upstream/vendor -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort || true
          } > p3ta-dependency-report.txt
      - name: Upload dependency debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3ta-dependency-debug
          path: |
            p3ta-dependency-report.txt
            lib/install_p3ta_tricks.sh
            install.sh
          if-no-files-found: error
